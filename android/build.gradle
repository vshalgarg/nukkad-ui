buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.8.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.0.2")  // specify a compatible version
        classpath("com.facebook.react:react-native-gradle-plugin:0.71.8") // or your RN version
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20")
    }
}

apply plugin: "com.facebook.react.rootproject"
